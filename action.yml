name: Open Issue Tracker
description: Track and report on open issues in a GitHub repository
author: GitHub Actions

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: alert-circle
  color: orange

# Define your inputs here.
inputs:
  github-token:
    description: GitHub token for API access
    required: true
  owner:
    description: Repository owner (organization or username)
    required: false
  repo:
    description: Repository name
    required: false

# Define your outputs here.
outputs:
  issue-count:
    description: Total count of open issues
  issue-summary:
    description: Summary of open issues

runs:
  using: node24
  main: dist/index.js
